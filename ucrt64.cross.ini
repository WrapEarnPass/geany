[binaries]
c = 'x86_64-w64-mingw32ucrt-gcc'
cpp = 'x86_64-w64-mingw32ucrt-g++'
ar = 'x86_64-w64-mingw32ucrt-ar'
windres = 'x86_64-w64-mingw32ucrt-windres'
strip = 'x86_64-w64-mingw32ucrt-strip'
exe_wrapper = 'wine'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
kernel = 'nt'
b_lto = true

[properties]
sys_root = '/usr/windows/ucrt64'
needs_exe_wrapper = true
pkg_config = '/usr/bin/pkg-config --define-prefix --env-only'
pkg_config_path = sys_root+'/lib/pkgconfig:'+ sys_root+'/share/pkgconfig'
c_std = 'c11'
cpp_std = 'c++17'